name: watch

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal run, check = test every source and print top stories (sends nothing)'
        type: choice
        options: [run, check]
        default: run

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write # only used to publish the feed branch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore memory of seen stories
        if: inputs.mode != 'check'
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-

      - name: Check sources
        if: inputs.mode == 'check'
        run: node src/index.js --check
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Watch for breaking news
        if: inputs.mode != 'check'
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ALERT_MENTION: ${{ vars.ALERT_MENTION }}
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          DISCORD_RUNDOWN_WEBHOOK_URL: ${{ secrets.DISCORD_RUNDOWN_WEBHOOK_URL }}
          RUNDOWN_TIMEZONE: ${{ vars.RUNDOWN_TIMEZONE || 'America/New_York' }}
          RUNDOWN_POST_HOURS: ${{ vars.RUNDOWN_POST_HOURS || '7,17' }}

      - name: Save memory of seen stories
        if: always() && inputs.mode != 'check'
        uses: actions/cache/save@v6
        with:
          path: .state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish alerts feed
        if: inputs.mode != 'check'
        run: .github/scripts/publish-feed.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # ---- Other channels (Rivals Report, Tag Assist). Separate config, state and feed folders;
      # they run after BBN's feed is published and can't fail BBN's run.
      - name: Restore channel memory
        if: inputs.mode != 'check'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cstate
          key: channel-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: channel-state-

      - name: Rivals Report watch
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: node src/index.js ${{ inputs.mode == 'check' && '--check' || '' }}
        env:
          CONFIG_DIR: config/channels/rivals
          STATE_PATH: .cstate/rivals/state.json
          FEED_DIR: .feed/rivals
          WRITE_HEALTH: '1'
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          RUNDOWN_TIMEZONE: America/New_York
          RUNDOWN_POST_HOURS: '99'

      - name: Tag Assist watch
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: node src/index.js ${{ inputs.mode == 'check' && '--check' || '' }}
        env:
          CONFIG_DIR: config/channels/tokon
          STATE_PATH: .cstate/tokon/state.json
          FEED_DIR: .feed/tokon
          WRITE_HEALTH: '1'
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          RUNDOWN_TIMEZONE: America/New_York
          RUNDOWN_POST_HOURS: '99'

      - name: Save channel memory
        if: always() && inputs.mode != 'check'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cstate
          key: channel-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish channel feeds
        if: always() && inputs.mode != 'check'
        continue-on-error: true
        run: .github/scripts/publish-feed.sh
        env:
          GH_TOKEN: ${{ github.token }}
