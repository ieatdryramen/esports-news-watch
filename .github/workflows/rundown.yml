name: rundown

# The watch run (every 5 minutes) now refreshes the rundown hourly and posts it
# at the posting hours; GitHub's own schedule never fired on this repo. This
# workflow stays for posting a rundown by hand.
on:
  workflow_dispatch:

concurrency:
  group: rundown
  cancel-in-progress: false

permissions:
  contents: write # only used to publish the feed branch

jobs:
  rundown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: node src/index.js --rundown
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_RUNDOWN_WEBHOOK_URL: ${{ secrets.DISCORD_RUNDOWN_WEBHOOK_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          RUNDOWN_TIMEZONE: ${{ vars.RUNDOWN_TIMEZONE || 'America/New_York' }}
          RUNDOWN_POST_HOURS: ${{ vars.RUNDOWN_POST_HOURS || '7,17' }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Publish rundown feed
        run: .github/scripts/publish-feed.sh
        env:
          GH_TOKEN: ${{ github.token }}
