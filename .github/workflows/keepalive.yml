name: keepalive

# GitHub turns off scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling the watch workflow monthly keeps it running.

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
